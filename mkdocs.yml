          - Entrega y evaluación: 3eso/b05/entrega.md
      - B06 · Programación y web:
          - Portada: 3eso/b06/index.md
          - Aprende: 3eso/b06/aprende.md
          - Actividades: 3eso/b06/actividades.md
          - Proyecto: 3eso/b06/proyecto.md
          - Entrega y evaluación: 3eso/b06/entrega.md
      - Proyecto final:
