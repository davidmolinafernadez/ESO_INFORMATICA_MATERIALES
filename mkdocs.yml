site_name: Informática · 3.º ESO
site_description: Aula digital de Informática para 3.º ESO
site_url: https://davidmolinafernadez.github.io/ESO_INFORMATICA_MATERIALES/
theme:
  name: material
  language: es
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
plugins:
  - search:
      lang: es
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/modo-clase.js
nav:
  - Inicio: index.md
  - Plan del curso: plan-curso.md
  - IA responsable: ia-responsable.md
  - Unidades de 3.º ESO:
      - Portada del curso: 3eso/index.md
      - B01 · Entorno digital, nube y ciudadanía:
          - Portada: 3eso/b01/index.md
          - Aprende: 3eso/b01/aprende.md
          - Actividades: 3eso/b01/actividades.md
          - Proyecto: 3eso/b01/proyecto.md
          - Entrega y evaluación: 3eso/b01/entrega.md
      - B02 · Hardware y sistemas operativos:
          - Portada: 3eso/b02/index.md
          - Aprende: 3eso/b02/aprende.md
          - Actividades: 3eso/b02/actividades.md
          - Proyecto: 3eso/b02/proyecto.md
          - Entrega y evaluación: 3eso/b02/entrega.md
      - B03 · Redes, ciberseguridad y privacidad:
          - Portada: 3eso/b03/index.md
          - Aprende: 3eso/b03/aprende.md
          - Actividades: 3eso/b03/actividades.md
          - Proyecto: 3eso/b03/proyecto.md
          - Entrega y evaluación: 3eso/b03/entrega.md
      - B04 · Documentos, hojas de cálculo y datos:
          - Portada: 3eso/b04/index.md
          - Aprende: 3eso/b04/aprende.md
          - Actividades: 3eso/b04/actividades.md
          - Proyecto: 3eso/b04/proyecto.md
          - Entrega y evaluación: 3eso/b04/entrega.md
      - B05 · Creación multimedia:
          - Portada: 3eso/b05/index.md
