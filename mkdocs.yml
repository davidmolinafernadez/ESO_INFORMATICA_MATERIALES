site_name: Taller de Profundización de Informática · 3.º ESO
site_url: https://davidmolinafernadez.github.io/ESO_INFORMATICA_MATERIALES/
theme:
  name: material
  language: es
  features: [navigation.sections, navigation.top, search.suggest, search.highlight, content.code.copy]
  palette:
    - scheme: default
      primary: custom
      accent: custom
plugins:
  - search:
      lang: es
markdown_extensions: [admonition, attr_list, md_in_html, tables, pymdownx.details, pymdownx.superfences]
extra_css: [stylesheets/extra.css]
extra_javascript: [javascripts/modo-clase.js]
